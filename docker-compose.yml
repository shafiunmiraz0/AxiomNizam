# docker-compose.yml — Single Service (API + Frontend merged) + PostgreSQL
#
services:
  axiomnizam:
    build: .
    container_name: axiomnizam
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - query_logs:/data/query_logs
      - storage-data:/data/storage
      - raft-data:/data/raft
      - certs-data:/data/certs
    networks:
      - axiomnizam-net
      - data-net

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axiomnizam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DATABASE:-app_db}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axiomnizam}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data-net

networks:
  axiomnizam-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  query_logs:
  storage-data:
  raft-data:
  certs-data:
